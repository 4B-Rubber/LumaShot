<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LumaShot · 完整重构原型</title>
<style>
:root{
  --accent:#1a7cff;--accent-2:#4b9bff;--accent-soft:rgba(26,124,255,.14);--danger:#e5484d;--ok:#2fb36d;--warn:#f5a524;
  --ink:#18212d;--ink2:#566174;--ink3:#8a94a3;
  --glass:rgba(247,249,252,.62);--glass-solid:#f5f8fc;--glass-border:rgba(255,255,255,.75);--edge:rgba(10,25,46,.10);
  --card:rgba(255,255,255,.58);--card-hover:rgba(255,255,255,.88);--code:rgba(240,243,248,.9);
  --shadow:0 18px 50px rgba(10,25,46,.24),0 2px 8px rgba(10,25,46,.10);
  --shadow-s:0 6px 18px rgba(10,25,46,.16);
  --blur:blur(30px) saturate(1.8);
  --r-panel:14px;--r-card:10px;--r-ctl:8px;
  --ease-spring:cubic-bezier(.25,1.2,.4,1);
  font-family:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
}
body.dark{
  --ink:#e9eef5;--ink2:#aab5c4;--ink3:#7c8898;
  --glass:rgba(37,44,56,.72);--glass-solid:#1c2532;--glass-border:rgba(141,167,197,.22);--edge:rgba(255,255,255,.08);
  --card:rgba(255,255,255,.055);--card-hover:rgba(255,255,255,.11);--code:rgba(10,14,20,.55);
  --shadow:0 18px 50px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);--shadow-s:0 6px 18px rgba(0,0,0,.35);
  --accent-soft:rgba(26,124,255,.24);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0d1320;color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
body.nomotion *,body.nomotion *:before,body.nomotion *:after{transition-duration:0s!important;animation:none!important}
#desk{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.glass{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);box-shadow:var(--shadow);color:var(--ink)}
body.noacrylic .glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--glass-solid)}
.ib{position:relative;width:34px;height:34px;border:0;border-radius:var(--r-ctl);background:none;color:var(--ink);display:inline-grid;place-items:center;cursor:pointer;flex:none;transition:background .12s,color .12s}
.ib:hover{background:var(--card-hover)}
.ib:active{transform:scale(.94)}
.ib.on{background:var(--accent-soft);color:var(--accent)}
.ib.go{background:var(--accent);color:#fff}
.ib.go:hover{background:var(--accent-2)}
.ib[disabled]{opacity:.35;pointer-events:none}
.ib svg{width:18px;height:18px}
.vsep{width:1px;height:20px;background:var(--edge);margin:0 5px;flex:none}
body.dark .vsep{background:rgba(255,255,255,.12)}
.kbd{font-size:11px;color:var(--ink3);border:1px solid var(--edge);border-radius:5px;padding:0 5px;line-height:17px;white-space:nowrap}
body.dark .kbd{border-color:rgba(255,255,255,.14)}
/* tooltip */
#tip{position:fixed;z-index:200;pointer-events:none;padding:3px 9px;border-radius:7px;font-size:12px;white-space:nowrap;opacity:0;transform:translateY(3px);transition:opacity .12s,transform .12s;background:var(--glass-solid);border:1px solid var(--glass-border);box-shadow:var(--shadow-s);color:var(--ink)}
#tip.show{opacity:1;transform:none}
#tip .kbd{margin-left:6px}

/* ===== dock (prototype controls) ===== */
#dock{position:fixed;left:12px;top:12px;z-index:15;display:flex;align-items:center;gap:2px;padding:4px;border-radius:12px}
#dock .brand{display:flex;align-items:center;gap:7px;padding:0 8px 0 4px;font-weight:700;font-size:12.5px}
.logo{width:22px;height:22px;border-radius:6px;background:#121924;display:grid;place-items:center;flex:none}
#dock .lbtn{height:30px;border:0;background:none;border-radius:8px;padding:0 10px;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px}
#dock .lbtn:hover{background:var(--card-hover)}
#dock .lbtn svg{width:15px;height:15px}
#tray-hit{position:fixed;z-index:6;width:36px;height:40px;border:0;background:transparent;cursor:pointer;border-radius:6px}
#tray-hit:hover{background:rgba(255,255,255,.18)}

/* ===== capture ===== */
#cap{position:fixed;inset:0;z-index:60;display:none;cursor:crosshair}
#cap.on{display:block}
#cap canvas{position:absolute;inset:0;width:100vw;height:100vh}
#capDim{position:absolute;inset:0;background:rgba(6,10,18,.38);transition:opacity .12s}
#selbox{position:absolute;display:none;outline:1.5px solid var(--accent);box-shadow:0 0 0 100vmax rgba(6,10,18,.38);pointer-events:none}
#selbox.hover{outline:2px solid var(--accent);outline-offset:-1px;background:rgba(26,124,255,.06)}
#selbox .h{position:absolute;width:9px;height:9px;background:#fff;border:1.5px solid var(--accent);border-radius:3px;pointer-events:none}
#selbox.hover .h{display:none}
#sizechip{position:absolute;display:none;padding:2px 9px;border-radius:7px;font-size:12px;font-variant-numeric:tabular-nums;pointer-events:none;white-space:nowrap}
#capHint{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);padding:6px 14px;border-radius:10px;font-size:12px;white-space:nowrap;pointer-events:none;display:flex;gap:12px}
#capHint b{font-weight:600}
#mag{position:absolute;display:none;width:132px;border-radius:12px;overflow:hidden;pointer-events:none;padding:0}
#mag canvas{position:static;display:block;width:132px;height:92px}
#mag .mi{padding:5px 9px;font-size:11px;line-height:1.5;font-variant-numeric:tabular-nums}
#mag .sw{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px;box-shadow:inset 0 0 0 1px #0003}
#annText{position:absolute;z-index:3;min-width:30px;outline:1.5px dashed var(--accent);outline-offset:3px;white-space:pre;line-height:1.25;cursor:text;font-family:"Segoe UI","Microsoft YaHei UI",sans-serif;font-weight:500}

/* ===== toolbar ===== */
#toolbar{position:fixed;z-index:70;border-radius:var(--r-panel);display:none;overflow:hidden;cursor:default;transition:opacity .15s}
#toolbar.on{display:block}
#drawer{height:0;overflow:hidden;transition:height .16s linear}
#toolbar.props #drawer{height:48px}
#drawerIn{display:flex;align-items:center;gap:12px;padding:0 12px;height:48px;border-bottom:1px solid var(--edge)}
.plabel{font-size:11px;color:var(--ink3);margin-right:-4px}
.sw{width:20px;height:20px;border-radius:6px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);position:relative;flex:none}
.sw.on:after{content:"";position:absolute;inset:-4px;border-radius:9px;border:2px solid var(--accent)}
.sw.rainbow{background:conic-gradient(#ef4444,#f59e0b,#eab308,#22c55e,#06b6d4,#3b82f6,#a855f7,#ef4444);border-radius:50%}
.wsel{display:flex;gap:2px}
.wsel button{width:30px;height:28px;border:0;background:none;border-radius:7px;cursor:pointer;display:grid;place-items:center}
.wsel button:hover{background:var(--card-hover)}
.wsel button.on{background:var(--accent-soft)}
.wsel i{display:block;border-radius:3px;background:var(--ink)}
.wsel.dots i{border-radius:50%}
.segm{display:flex;background:var(--card);border-radius:8px;padding:2px}
.segm button{border:0;background:none;border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--ink2)}
.segm button.on{background:var(--glass-solid);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
body.dark .segm button.on{background:rgba(255,255,255,.14)}
#toolRow{display:flex;align-items:center;gap:2px;padding:6px}
.outgrp{display:flex;gap:2px;padding:2px;border-radius:10px;background:var(--card)}

/* ===== strip ===== */
#strip{position:fixed;z-index:40;width:34px;height:108px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:9px 0 8px;cursor:pointer;touch-action:none;
  transition:transform .3s var(--ease-spring),opacity .2s,box-shadow .2s,border-radius .2s}
#strip.right{right:0;border-radius:12px 0 0 12px;border-right:0}
#strip.left{left:0;border-radius:0 12px 12px 0;border-left:0}
#strip.right:hover{transform:translateX(-3px)}#strip.left:hover{transform:translateX(3px)}
#strip.hide{opacity:0;pointer-events:none;transform:scale(.6)!important}
#strip.dragging{transition:opacity .2s;cursor:grabbing;border-radius:12px;border:1px solid var(--glass-border)}
#strip.drop{box-shadow:0 0 0 3px var(--accent),var(--shadow)}
#strip.right.drop{transform:translateX(-12px) scale(1.08)}#strip.left.drop{transform:translateX(12px) scale(1.08)}
#strip .cnt{min-width:22px;height:22px;border-radius:11px;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:700;display:grid;place-items:center;padding:0 5px}
#strip.pulse .cnt{animation:pulse .6s}
#strip .paused{position:absolute;top:6px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--warn);display:none}
#strip.is-paused .paused{display:block}
@keyframes pulse{0%{transform:scale(1)}35%{transform:scale(1.4);background:var(--accent);color:#fff}100%{transform:scale(1)}}
#strip .chev{color:var(--ink3);display:flex}
#strip.left .chev{transform:scaleX(-1)}
/* legacy: opaque self-drawn strip with shoulders */
#strip.legacy{background:var(--glass-solid)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
#strip.legacy:before,#strip.legacy:after{content:"";position:absolute;width:12px;height:12px}
#strip.legacy.right:before{right:0;top:-12px;background:radial-gradient(circle at 0 0,transparent 11.5px,var(--glass-solid) 12px)}
#strip.legacy.right:after{right:0;bottom:-12px;background:radial-gradient(circle at 0 100%,transparent 11.5px,var(--glass-solid) 12px)}
#strip.legacy.left:before{left:0;top:-12px;background:radial-gradient(circle at 100% 0,transparent 11.5px,var(--glass-solid) 12px)}
#strip.legacy.left:after{left:0;bottom:-12px;background:radial-gradient(circle at 100% 100%,transparent 11.5px,var(--glass-solid) 12px)}
#strip.legacy.dragging:before,#strip.legacy.dragging:after{display:none}
#peek{position:fixed;z-index:39;width:132px;border-radius:10px;overflow:hidden;box-shadow:var(--shadow);border:2px solid #fff;opacity:0;pointer-events:none;transition:all .32s var(--ease-spring);background:#fff}
#peek img{display:block;width:100%;max-height:90px;object-fit:cover}
#peek .pt{padding:5px 8px;font-size:11.5px;color:#334;max-height:44px;overflow:hidden}
#peek.show{opacity:1;transform:none!important}
#dropHint{position:fixed;z-index:41;padding:5px 10px;border-radius:8px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .15s;white-space:nowrap}
#dropHint.show{opacity:1}

/* ===== panel ===== */
#panel{position:fixed;z-index:50;width:384px;display:flex;flex-direction:column;opacity:0;pointer-events:none;
  transition:transform .4s var(--ease-spring),opacity .16s}
#panel.right{right:0;border-radius:16px 0 0 16px;border-right:0}
#panel.left{left:0;border-radius:0 16px 16px 0;border-left:0}
#panel.open{transform:none!important;opacity:1;pointer-events:auto}
#panel>*{transition:opacity .18s .1s}
#panel:not(.open)>*{opacity:0;transition-delay:0s}
.ph{display:flex;align-items:center;gap:10px;padding:14px 12px 8px 14px}
.ph .logo{width:30px;height:30px;border-radius:8px}
.ph .t{font-weight:700;font-size:15px;line-height:1.15}
.ph .t small{display:block;font-weight:400;color:var(--ink3);font-size:11px}
.ph .sp{flex:1}
.ph .ib{width:30px;height:30px}.ph .ib svg{width:16px;height:16px}
.rec{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);padding:4px 10px;border-radius:99px;background:var(--card);cursor:pointer;border:0;white-space:nowrap}
.rec i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(47,179,109,.2)}
.rec.paused i{background:var(--warn);box-shadow:0 0 0 3px rgba(245,165,36,.22)}
.search{margin:2px 12px 8px;display:flex;align-items:center;gap:8px;padding:0 10px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--edge);transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:13px;outline:none}
.search input::placeholder{color:var(--ink3)}
.chips{display:flex;gap:4px;padding:0 12px 6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:none;color:var(--ink2);font-size:12.5px;padding:4px 10px;border-radius:99px;cursor:pointer;white-space:nowrap}
.chip:hover{background:var(--card)}
.chip b{font-weight:600;color:var(--ink3);margin-left:4px;font-size:11px}
.chip.on{background:var(--ink);color:var(--glass-solid)}
.chip.on b{color:inherit;opacity:.65}
#list{flex:1;overflow-y:auto;padding:0 10px 10px;scrollbar-width:thin;scrollbar-color:rgba(128,128,128,.35) transparent}
.grp{font-size:11.5px;color:var(--ink3);padding:10px 6px 5px;font-weight:600;display:flex;justify-content:space-between}
.item{position:relative;border-radius:var(--r-card);background:var(--card);margin-bottom:6px;padding:9px 10px 8px 32px;cursor:default;border:1px solid transparent;transition:background .12s,border-color .12s}
.item:hover{background:var(--card-hover)}
.item.cur{border-color:var(--accent)}
.item.msel{background:var(--accent-soft)!important;border-color:rgba(26,124,255,.45)}
.item.new{animation:slidein .45s var(--ease-spring)}
@keyframes slidein{from{transform:translateY(-12px) scale(.96);opacity:0}}
.idx{position:absolute;left:8px;top:10px;width:17px;height:17px;border-radius:5px;font-size:10px;font-weight:700;display:grid;place-items:center;color:var(--ink3);border:1px solid var(--edge);transition:all .12s}
body.alt .idx:not(:empty){background:var(--accent);color:#fff;border-color:var(--accent);transform:scale(1.1)}
.item.msel .idx{background:var(--accent);border-color:var(--accent);color:#fff}
.meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);margin-top:6px;white-space:nowrap;overflow:hidden}
.meta .k{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--ink2)}
.meta .k svg{width:12px;height:12px}
.meta .star{color:var(--warn)}
.meta .sp{flex:1}
.acts{position:absolute;right:7px;top:6px;display:flex;gap:1px;padding:2px;border-radius:9px;opacity:0;transform:translateY(-3px);transition:all .12s;pointer-events:none;z-index:2;box-shadow:var(--shadow-s)}
.item:hover .acts,.item.cur .acts{opacity:1;transform:none;pointer-events:auto}
.acts .ib{width:28px;height:28px}.acts .ib svg{width:15px;height:15px}
.thumb{border-radius:7px;overflow:hidden;border:1px solid var(--edge);background:repeating-conic-gradient(#0000000d 0 25%,#0000 0 50%) 0 0/14px 14px;cursor:grab;display:flex;justify-content:center;max-height:150px}
.thumb img{display:block;max-width:100%;max-height:150px;object-fit:contain;pointer-events:none}
.txt{font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
pre.code{margin:0;font:12px/1.55 "Cascadia Code",Consolas,monospace;background:var(--code);padding:7px 9px;border-radius:7px;overflow:hidden;white-space:pre;max-height:76px;color:var(--ink)}
.kw{color:#c2410c}.fn{color:#2563eb}.str{color:#15803d}.cm{color:#8a94a3}.nb{color:#9333ea}
body.dark .kw{color:#fb923c}body.dark .fn{color:#7cb4ff}body.dark .str{color:#86efac}body.dark .nb{color:#d8b4fe}
.lang{font-size:10px;font-weight:800;padding:0 5px;border-radius:4px;background:#f7df1e;color:#222;letter-spacing:.3px}
.lrow{display:flex;gap:10px;align-items:center;min-width:0}
.lrow>div{min-width:0}
.fav{width:38px;height:38px;border-radius:9px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px}
.ti{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u{font-size:12px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fileic{width:32px;height:38px;border-radius:4px 10px 4px 4px;background:#fff;border:1px solid #d9dee6;position:relative;flex:none}
.fileic b{position:absolute;left:-4px;bottom:6px;color:#fff;font-size:8.5px;font-weight:800;padding:0 4px;border-radius:3px}
.swatch{width:38px;height:38px;border-radius:9px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
mark{background:rgba(255,213,74,.6);color:inherit;border-radius:3px;padding:0 1px}
.pfoot{padding:8px 14px 12px;border-top:1px solid var(--edge);font-size:11.5px;color:var(--ink3)}
.pfoot .r{display:flex;justify-content:space-between;gap:8px}
.cap{height:4px;border-radius:2px;background:var(--card);margin-top:6px;overflow:hidden}
.cap i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.empty{text-align:center;color:var(--ink3);padding:50px 20px;font-size:13px}
.empty svg{width:56px;height:56px;opacity:.5;margin-bottom:8px}
#bulk{display:none;align-items:center;gap:6px;margin:0 10px 8px;padding:6px 6px 6px 12px;border-radius:10px;background:var(--accent);color:#fff;font-size:12.5px}
#bulk.on{display:flex}
#bulk .sp{flex:1}
#bulk button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:7px;padding:4px 9px;cursor:pointer;font-size:12px}
#bulk button:hover{background:rgba(255,255,255,.3)}

/* quick look */
#ql{position:fixed;z-index:52;width:440px;max-height:70vh;border-radius:14px;display:none;flex-direction:column;overflow:hidden}
#ql.on{display:flex;animation:qlin .22s var(--ease-spring)}
@keyframes qlin{from{opacity:0;transform:scale(.96)}}
#ql .qh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--edge);font-size:12px;color:var(--ink2)}
#ql .qh b{color:var(--ink);font-size:13px}
#ql .qb{overflow:auto;padding:12px;flex:1}
#ql .qb img{display:block;max-width:100%;border-radius:8px;margin:auto;box-shadow:var(--shadow-s)}
#ql pre{margin:0;font:12.5px/1.6 "Cascadia Code",Consolas,monospace;white-space:pre-wrap;user-select:text}
#ql .qt{font-size:14px;line-height:1.7;user-select:text;white-space:pre-wrap}

/* menus */
.menu{position:fixed;z-index:120;min-width:212px;padding:5px;border-radius:12px;animation:min .14s ease-out}
@keyframes min{from{opacity:0;transform:scale(.97) translateY(-3px)}}
.menu .mh{padding:6px 10px 4px;font-size:11.5px;color:var(--ink3)}
.mi{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap}
.mi svg{width:16px;height:16px;flex:none;opacity:.85}
.mi .k{margin-left:auto;padding-left:18px;color:var(--ink3);font-size:12px}
.mi:hover,.mi.act{background:var(--accent-soft);color:var(--accent)}
.mi:hover .k{color:var(--accent)}
.mi.dis{opacity:.4;pointer-events:none}
.mi.danger:hover{background:rgba(229,72,77,.12);color:var(--danger)}
.mi .chk{width:16px;display:grid;place-items:center;color:var(--accent)}
.msep{height:1px;background:var(--edge);margin:4px 8px}

/* pins */
.pin{position:fixed;z-index:20;touch-action:none;outline:none}
.pin .paper{position:relative;cursor:move;transition:box-shadow .2s}
.pin .paper img{display:block;width:100%;height:100%;pointer-events:none;user-select:none}
.pin .paper canvas{position:absolute;inset:0;width:100%;height:100%;display:none}
.pin.annot .paper canvas{display:block;cursor:crosshair}
.pin.s-shadow .paper{box-shadow:0 10px 28px rgba(0,0,0,.30),0 0 0 1px rgba(0,0,0,.10)}
.pin.s-card .paper{padding:6px;background:#fff;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.28)}
.pin.s-card .paper img{border-radius:5px}
.pin.s-polaroid .paper{padding:8px 8px 34px;background:#fffdf7;box-shadow:0 12px 30px rgba(0,0,0,.30)}
.pin.s-curl .paper{padding:10px;background:#fff;box-shadow:0 12px 30px rgba(0,0,0,.28);border-radius:2px 2px 16px 2px}
.pin.s-curl .paper:after{content:"";position:absolute;right:0;bottom:0;width:28px;height:28px;background:linear-gradient(135deg,#fff 45%,#d9d4c8 50%,#f3efe6 60%);border-radius:0 0 16px 0;box-shadow:-3px -3px 6px rgba(0,0,0,.12)}
.pin.focus.s-none .paper,.pin.focus.s-shadow .paper{box-shadow:0 0 0 2px var(--accent),0 12px 30px rgba(0,0,0,.3)}
.pin .imgwrap{position:relative;width:100%;height:100%}
.pin .ocr{position:absolute;inset:0;pointer-events:none}
.pin .ocr span{position:absolute;border-radius:3px;pointer-events:auto;cursor:text;transition:background .1s}

  actions.forEach(([l,fn])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{toastEl.classList.remove('show');fn()};toastEl.appendChild(b)});

  {chk:stripVisible,l:'显示剪贴板侧边条',f:()=>setStripVisible(!stripVisible)},{chk:S.rope,l:'顶部晾衣绳',f:()=>{S.rope=!S.rope}},'-',{i:'gear',l:'设置…',f:openSettings},{i:'help',l:'快捷键',f:openHelp}],r.left-150,r.top-8-430)};

function applySettings(){document.body.classList.toggle('dark',S.theme==='dark');document.body.classList.toggle('noacrylic',!S.acrylic);document.body.classList.toggle('nomotion',!S.motion);
  stripEl.classList.toggle('legacy',S.stripMat==='legacy');drawDesktop();pins.forEach(p=>{const pad0=padOf();p.className=p.className.replace(/s-\w+/,'s-'+S.pinStyle)})}
function openSettings(){closeMenus();const d=$('#setDlg');
  const segH=(k,opts)=>`<div class="segm">${opts.map(([v,l])=>`<button data-sk="${k}" data-v="${v}" class="${String(S[k])===String(v)?'on':''}">${l}</button>`).join('')}</div>`;
  const pv={none:'',shadow:'box-shadow:0 3px 8px #0005',card:'outline:4px solid #fff;border-radius:4px;box-shadow:0 3px 8px #0004',polaroid:'border:3px solid #fffdf7;border-bottom-width:10px;box-shadow:0 3px 8px #0004',curl:'border:4px solid #fff;border-radius:2px 2px 9px 2px;box-shadow:0 3px 8px #0004'};
  d.innerHTML=`<h3><span class="logo" data-logo style="width:28px;height:28px;border-radius:8px">${LOGO(18)}</span>设置 · 外观</h3><p class="sub">只列出和本次重构相关的选项。保存后立即作用于所有界面。</p>
  <div class="srow"><div class="l"><b>主题</b><span>工具面板、剪贴板、贴图菜单统一跟随</span></div>${segH('theme',[['light','浅色'],['dark','深色']])}</div>
  <div class="srow"><div class="l"><b>亚克力效果</b><span>关闭后所有浮层用同一种实色 Fallback</span></div>${segH('acrylic',[[true,'开'],[false,'关']])}</div>
  <div class="srow"><div class="l"><b>剪贴板侧边条材质</b><span>“现状”用于对比旧版的割裂感</span></div>${segH('stripMat',[['new','统一亚克力'],['legacy','现状（实色）']])}</div>
  <div class="srow"><div class="l"><b>界面动画</b><span>关闭时所有过渡直接跳到终态</span></div>${segH('motion',[[true,'开'],[false,'关']])}</div>
  <div class="srow" style="display:block"><div class="l"><b>截图贴纸</b><span>只影响桌面贴图的外观，不写入复制和保存的图片</span></div>
   <div class="styles">${[['none','无'],['shadow','边框阴影'],['card','圆角卡片'],['polaroid','拍立得'],['curl','卷角纸张']].map(([k,l])=>`<div class="stl ${S.pinStyle===k?'on':''}" data-ps="${k}"><div class="pv" style="${pv[k]}"></div>${l}</div>`).join('')}</div></div>
  <div class="foot"><button class="btn" id="setReset">恢复默认</button><button class="btn primary" id="setOk">完成</button></div>`;
  d.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{const k=b.dataset.sk,v=b.dataset.v;S[k]=v==='true'?true:v==='false'?false:v;applySettings();openSettings()});
  d.querySelectorAll('[data-ps]').forEach(b=>b.onclick=()=>{S.pinStyle=b.dataset.ps;applySettings();openSettings()});
  $('#setOk').onclick=()=>$('#setScrim').classList.remove('on');$('#setReset').onclick=()=>{Object.assign(S,{theme:'light',pinStyle:'shadow',stripMat:'new',acrylic:true,motion:true});applySettings();openSettings()};
  $('#setScrim').classList.add('on')}
$('#setScrim').addEventListener('pointerdown',e=>{if(e.target.id==='setScrim')$('#setScrim').classList.remove('on')});
function openHelp(){closeMenus();const K=(a,b)=>`<div><span>${a}</span><span class="kbd">${b}</span></div>`;
  $('#helpDlg').innerHTML=`<h3>${ic('help',20)}快捷键</h3><p class="sub">原型里能用的快捷键（浏览器里 Win+V 改为 Alt+V）</p><div class="help">
  <h4>全局</h4>${K('截图','Ctrl+Alt+A')}${K('框选后直接钉图','Ctrl+Alt+P')}${K('框选后识别文字','Ctrl+Alt+O')}${K('剪贴板','Alt+V')}${K('快捷键说明','?')}${K('把系统剪贴板内容加入历史','Ctrl+V')}
  <h4>截图</h4>${K('选择 / 矩形 / 椭圆 / 箭头','V R E A')}${K('画笔 / 文字 / 马赛克 / 序号','P T M N')}${K('完成并复制','Enter')}${K('钉图 / OCR','P(选区后) · O')}${K('保存','Ctrl+S')}${K('撤销 / 重做','Ctrl+Z / Y')}${K('当前屏幕','F')}${K('取消','Esc / 右键')}${K('删除选中标注','Delete')}${K('等比 / 45°','按住 Shift')}
  <h4>贴图</h4>${K('标注','空格')}${K('锁定','L')}${K('晾到绳上','H')}${K('复制图片 / 所选文字','Ctrl+C')}${K('缩放','滚轮')}${K('关闭','双击空白 / Esc')}${K('加入剪贴板历史','拖到侧边条')}${K('取回晾着的贴图','鼠标停在屏幕顶端')}
  <h4>剪贴板</h4>${K('选择','↑ ↓')}${K('粘贴 / 纯文本粘贴','Enter / Shift+Enter')}${K('快速预览','空格')}${K('快速粘贴第 N 条','Alt+1…9')}${K('收藏','Ctrl+D')}${K('删除','Delete')}${K('多选','Ctrl / Shift+单击')}${K('固定面板','F2')}${K('搜索','Ctrl+F')}${K('收起','Esc')}
  </div><div class="foot"><button class="btn primary" onclick="document.getElementById('helpScrim').classList.remove('on')">知道了</button></div>`;$('#helpScrim').classList.add('on')}
$('#helpScrim').addEventListener('pointerdown',e=>{if(e.target.id==='helpScrim')$('#helpScrim').classList.remove('on')});

/* ============================================================ global keys */
function panelKey(e){const vis=visible();const k=e.key;
  if(k==='ArrowDown'){curIdx=Math.min(vis.length-1,curIdx+1);renderList();if(qlItem)showQL(vis[curIdx]);return true}
  if(k==='ArrowUp'){curIdx=Math.max(0,curIdx-1);renderList();if(qlItem)showQL(vis[curIdx]);return true}
  if(k==='Enter'){if(vis[curIdx])pasteItem(vis[curIdx],e.shiftKey);return true}
  if(k==='Escape'){if(qlItem){hideQL();return true}if(query){query='';$('#q').value='';renderList();return true}closePanel(true);return true}
  if(e.altKey&&/^[1-9]$/.test(k)){const it=vis[+k-1];if(it){curIdx=+k-1;renderList();pasteItem(it)}return true}
  return false}
document.addEventListener('keydown',e=>{
  const k=e.key,ctrl=e.ctrlKey||e.metaKey,inInput=e.target.matches&&e.target.matches('input,textarea,[contenteditable="true"]');
  if(k==='Alt'){document.body.classList.add('alt');e.preventDefault()}
  if($('#setScrim').classList.contains('on')||$('#helpScrim').classList.contains('on')){if(k==='Escape'){$('#setScrim').classList.remove('on');$('#helpScrim').classList.remove('on')}return}
  if(menuEl&&k==='Escape'){closeMenus();return}
  if(menuEl&&(k==='ArrowDown'||k==='ArrowUp'||k==='Enter')){e.preventDefault();const it=menuEl._items;if(k==='Enter'){it[menuEl._i]&&it[menuEl._i].click();return}menuEl._i=(menuEl._i+(k==='ArrowDown'?1:-1)+it.length)%it.length;it.forEach((x,i)=>x.classList.toggle('act',i===menuEl._i));return}
  // global hotkeys
  if(ctrl&&e.altKey&&(k==='a'||k==='A')){e.preventDefault();startCapture();return}
  if(ctrl&&e.altKey&&(k==='p'||k==='P')){e.preventDefault();startCapture('pin');return}
  if(ctrl&&e.altKey&&(k==='o'||k==='O')){e.preventDefault();startCapture('ocr');return}
  if(e.altKey&&!ctrl&&(k==='v'||k==='V')){e.preventDefault();panelOpen?closePanel(true):openPanel();return}
  if(C){
    if(activeEditor&&activeEditor.editing)return;
    if(k==='Escape'){e.preventDefault();endCapture();return}
    if(!C.sel){if(k==='f'||k==='F'){C.sel={x:0,y:0,w:W,h:H};finishSel()}if((k==='c'||k==='C')&&C.hex){writeSys(C.hex);addItem({type:'color',text:C.hex,from:'取色'},{silent:true});toast('已复制颜色 '+C.hex)}return}
    if(k==='Enter'||(ctrl&&k.toLowerCase()==='c')){e.preventDefault();command('done');return}
    if(ctrl&&k.toLowerCase()==='s'){e.preventDefault();command('save');return}
    if(ctrl&&k.toLowerCase()==='z'){e.preventDefault();command('undo');return}
    if(ctrl&&k.toLowerCase()==='y'){e.preventDefault();command('redo');return}
    if((k==='Delete'||k==='Backspace')&&activeEditor.sel){activeEditor.snapshot();activeEditor.objs=activeEditor.objs.filter(o=>o!==activeEditor.sel);activeEditor.sel=null;activeEditor.render();renderToolbar();return}
    const map={v:'select',r:'rect',e:'ellipse',a:'arrow',t:'text',m:'mosaic',n:'num'};
    if(!ctrl&&map[k.toLowerCase()]){setTool(map[k.toLowerCase()]);return}
    if(!ctrl&&k.toLowerCase()==='p'){command('pin');return}
    if(!ctrl&&k.toLowerCase()==='o'){command('ocr');return}
    return}
  if(pinEdit){if(activeEditor&&activeEditor.editing)return;
    if(k==='Escape'){endPinAnnot(false);return}if(k==='Enter'){pinCommand('done');return}
    if(ctrl&&k.toLowerCase()==='z'){e.preventDefault();pinCommand('undo');return}if(ctrl&&k.toLowerCase()==='y'){e.preventDefault();pinCommand('redo');return}
    const map={v:'select',r:'rect',e:'ellipse',a:'arrow',p:'pen',t:'text',m:'mosaic',n:'num'};if(!ctrl&&map[k.toLowerCase()]){setTool(map[k.toLowerCase()]);return}return}
  if(panelOpen){
    if(k==='F2'){e.preventDefault();togglePanelPin();return}
    if(ctrl&&k.toLowerCase()==='f'){e.preventDefault();$('#q').focus();$('#q').select();return}
    if(k===' '&&!inInput){e.preventDefault();const it=visible()[curIdx];if(qlItem)hideQL();else if(it)showQL(it);return}
    if(k===' '&&inInput&&!$('#q').value){e.preventDefault();const it=visible()[curIdx];if(qlItem)hideQL();else if(it)showQL(it);return}
    if(ctrl&&k.toLowerCase()==='d'){e.preventDefault();const it=visible()[curIdx];if(it){it.star=!it.star;renderList()}return}
    if(k==='Delete'&&!$('#q').value){const it=visible()[curIdx];if(it)itemAction(it,'del');return}
    if(!inInput&&panelKey(e)){e.preventDefault();return}
    if(!inInput&&k.length===1&&!ctrl&&!e.altKey){$('#q').focus()}
    return}
  if(inInput)return;
  if(focusPin&&document.body.contains(focusPin)&&focusPin.style.display!=='none'){const p=focusPin;
    if(k===' '){e.preventDefault();startPinAnnot(p);return}if(k==='l'||k==='L'){toggleLock(p);return}if(k==='h'||k==='H'){hang(p);return}
    if(ctrl&&k.toLowerCase()==='c'){e.preventDefault();const sel=p.querySelector('.ocr .sel');if(sel){const t=pinText(p,true);writeSys(t);addItem({type:'text',text:t,from:'贴图文字'},{silent:true});toast('已复制所选文字')}else copyPin(p);return}
    if(ctrl&&k.toLowerCase()==='a'&&p._ocrOn){e.preventDefault();p.querySelectorAll('.ocr span').forEach(s=>s.classList.add('sel'));return}
    if(k==='Escape'){if(p.querySelector('.ocr .sel'))p.querySelectorAll('.ocr .sel').forEach(s=>s.classList.remove('sel'));else closePin(p);return}}
  if(k==='?'){openHelp();return}
});
document.addEventListener('keyup',e=>{if(e.key==='Alt')document.body.classList.remove('alt')});
window.addEventListener('blur',()=>document.body.classList.remove('alt'));
/* clicks on desktop */
desk.addEventListener('pointerdown',()=>{setFocusPin(null);if(panelOpen)closePanel();hideQL()});
document.addEventListener('pointerdown',e=>{if(panelOpen&&!panelPinned&&!panel.contains(e.target)&&!ql.contains(e.target)&&!e.target.closest('.menu,#toast,.pin,.scrim,#dock'))closePanel()});
/* system clipboard bridge */
document.addEventListener('paste',e=>{if(e.target.matches&&e.target.matches('input,[contenteditable="true"]'))return;const dt=e.clipboardData;if(!dt)return;
  const f=[...dt.items].find(i=>i.type.startsWith('image/'));
  if(f){const file=f.getAsFile();const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{if(addItem({type:'image',src:rd.result,w:im.width,h:im.height,from:'系统剪贴板'}))toast('已把系统剪贴板里的图片加入历史',[['查看',openPanel],['钉到桌面',()=>createPin({src:rd.result,rect:{x:W/2-Math.min(im.width/dpr,500)/2,y:120,w:Math.min(im.width/dpr,500),h:Math.min(im.width/dpr,500)*im.height/im.width}})]])};im.src=rd.result};rd.readAsDataURL(file);e.preventDefault();return}
  const t=dt.getData('text/plain');if(t&&t.trim()){const ty=detect(t);const it={type:ty,text:t.trim(),from:'系统剪贴板'};if(ty==='link'){try{it.title=new URL(t.trim()).hostname}catch(_){}}if(ty==='code')it.lang=/=>|const|let|function/.test(t)?'JS':/def |import /.test(t)?'PY':'CODE';
    if(ty==='file'){const parts=t.trim().split('\\');it.text=parts.pop();it.path=parts.join('\\')+'\\';it.ext=(it.text.split('.').pop()||'').toUpperCase().slice(0,4)}
    if(addItem(it))toast(`已加入剪贴板历史（识别为${typeName[ty]}）`,[['查看',openPanel]]);e.preventDefault()}});
document.addEventListener('copy',e=>{const s=String(getSelection()||'').trim();if(s&&!C){setTimeout(()=>addItem({type:detect(s),text:s,from:'LumaShot 预览'},{silent:false}),0)}});

/* dock */
$('#dCap').innerHTML=ic('scissors',15)+'截图';$('#dPin').innerHTML=ic('pin',15)+'贴图';$('#dOcr').innerHTML=ic('ocr',15)+'OCR';$('#dClip').innerHTML=ic('clip',15)+'剪贴板';
$('#dSet').innerHTML=ic('gear',16);$('#dHelp').innerHTML=ic('help',16);$('#wClose').innerHTML=ic('close',16);
$('#dCap').onclick=()=>startCapture();$('#dPin').onclick=()=>startCapture('pin');$('#dOcr').onclick=()=>startCapture('ocr');$('#dClip').onclick=()=>panelOpen?closePanel(true):openPanel();
$('#dSet').onclick=openSettings;$('#dHelp').onclick=openHelp;$('#wClose').onclick=()=>$('#welcome').classList.add('gone');
$('#dock').addEventListener('pointerdown',e=>e.stopPropagation());

/* resize & init */
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(C)endCapture();drawDesktop();layoutStrip();if(panelOpen)panel.style.height=(H-TB-28)+'px'},120)});
setInterval(()=>{if(!C)drawDesktop()},60000);
drawDesktop();seed();layoutStrip();renderList();applySettings();
setTimeout(()=>$('#welcome').classList.add('gone'),14000);
window.__ls={startCapture,command,openPanel,closePanel,createPin,items:()=>items,pins,S,applySettings,setTool,hang};
})();
</script>
</body>
